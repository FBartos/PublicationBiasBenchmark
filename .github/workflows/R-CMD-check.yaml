# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_DONTTEST_EXAMPLES_: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install JAGS on macOS
        if: runner.os == 'macOS'
        run: |
          brew install jags
          pkg-config --modversion jags

      - name: Install JAGS on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jagsRoot = "C:\Program Files\JAGS\JAGS-4.3.2"
          $installer = Join-Path $env:RUNNER_TEMP "JAGS-4.3.2.exe"
          Invoke-WebRequest `
            -Uri "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.2.exe/download" `
            -OutFile $installer
          if ((Get-Item $installer).Length -lt 1MB) {
            throw "JAGS installer download looks incomplete."
          }
          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait
          if (!(Test-Path "$jagsRoot\include\distribution\ArrayDist.h")) {
            throw "JAGS headers not found under $jagsRoot."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.2"
          Add-Content -Path $env:GITHUB_PATH -Value "$jagsRoot\x64\bin"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            BayesTools=url::https://cran.r-project.org/src/contrib/Archive/BayesTools/BayesTools_0.2.23.tar.gz
            RoBMA=url::https://cran.r-project.org/src/contrib/Archive/RoBMA/RoBMA_3.6.1.tar.gz
            any::rcmdcheck
          dependencies: '"all"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
