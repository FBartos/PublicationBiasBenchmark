# Workflow for running package tests
# This runs on pull requests and pushes to master branch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-package

jobs:
  test-package:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install JAGS on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jagsRoot = "C:\Program Files\JAGS\JAGS-4.3.2"
          $installer = Join-Path $env:RUNNER_TEMP "JAGS-4.3.2.exe"
          Invoke-WebRequest `
            -Uri "https://sourceforge.net/projects/mcmc-jags/files/JAGS/4.x/Windows/JAGS-4.3.2.exe/download" `
            -OutFile $installer
          if ((Get-Item $installer).Length -lt 1MB) {
            throw "JAGS installer download looks incomplete."
          }
          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait
          if (!(Test-Path "$jagsRoot\include\distribution\ArrayDist.h")) {
            throw "JAGS headers not found under $jagsRoot."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.2"
          Add-Content -Path $env:GITHUB_PATH -Value "$jagsRoot\x64\bin"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            BayesTools=url::https://cran.r-project.org/src/contrib/Archive/BayesTools/BayesTools_0.2.23.tar.gz
            RoBMA=url::https://cran.r-project.org/src/contrib/Archive/RoBMA/RoBMA_3.6.1.tar.gz
            any::testthat
            any::devtools
          dependencies: '"all"'

      - name: Run tests
        run: |
          devtools::test()
        shell: Rscript {0}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: tests/testthat/*.Rout*
