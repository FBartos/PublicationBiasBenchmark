name: Set up JAGS
description: Install JAGS and configure library paths for packages that link to it.
runs:
  using: composite
  steps:
    - name: Install JAGS on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        # RoBMA 3.6.1 uses the JAGS 4.x module interface. The signed
        # universal macOS package is built for R 4.3 and later.
        installer="$RUNNER_TEMP/JAGS-4.3.2.pkg"
        curl --fail --location --retry 3 --retry-all-errors \
          --output "$installer" \
          "https://downloads.sourceforge.net/project/mcmc-jags/JAGS/4.x/Mac%20OS%20X/JAGS-4.3.2.pkg"
        echo '14d171621a582d29a7e6ce11eccf853170367c17d41554e07b88abed76a2fb7e  '"$installer" | shasum -a 256 -c -
        sudo installer -pkg "$installer" -target /

        jags_prefix="/usr/local"
        PKG_CONFIG_PATH="$jags_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
          pkg-config --modversion jags | grep -x '4.3.2'

        echo "$jags_prefix/bin" >> "$GITHUB_PATH"
        {
          echo "JAGS_HOME=$jags_prefix"
          echo "PKG_CONFIG_PATH=$jags_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        } >> "$GITHUB_ENV"

    - name: Install JAGS on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        function Test-JagsInstaller {
          param([string]$Path)

          if (!(Test-Path $Path)) {
            return $false
          }
          if ((Get-Item $Path).Length -lt 20MB) {
            return $false
          }

          $magic = [System.IO.File]::ReadAllBytes($Path)[0..1]
          return ($magic[0] -eq 0x4D -and $magic[1] -eq 0x5A)
        }

        $jagsRoot = "C:\Program Files\JAGS\JAGS-4.3.2"
        $installer = Join-Path $env:RUNNER_TEMP "JAGS-4.3.2.exe"
        $urls = @(
          "https://github.com/r-universe-org/actions/releases/download/JAGS-4.3.2/JAGS-4.3.2.exe"
        )

        $downloaded = $false
        foreach ($url in $urls) {
          Remove-Item $installer -ErrorAction SilentlyContinue
          try {
            Invoke-WebRequest `
              -Uri $url `
              -Headers @{ "User-Agent" = "Mozilla/5.0" } `
              -MaximumRedirection 10 `
              -OutFile $installer

            if (Test-JagsInstaller $installer) {
              $downloaded = $true
              break
            }

            Write-Warning "Downloaded file from ${url} was not a Windows installer."
          } catch {
            Write-Warning "Failed to download JAGS from ${url}: $($_.Exception.Message)"
          }
        }

        if (!$downloaded) {
          throw "Could not download a valid JAGS installer."
        }
        $expectedHash = "197f3b32f35462fdbbb566035f459bade6c61207fb2bada265be1504c0fa414f"
        if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expectedHash) {
          throw "JAGS installer checksum did not match the release asset."
        }

        $process = Start-Process `
          -FilePath $installer `
          -ArgumentList "/S" `
          -Wait `
          -PassThru
        if ($process.ExitCode -ne 0) {
          throw "JAGS installer failed with exit code $($process.ExitCode)."
        }
        if (!(Test-Path "$jagsRoot\include\distribution\ArrayDist.h")) {
          throw "JAGS headers not found under $jagsRoot."
        }

        Add-Content -Path $env:GITHUB_ENV -Value "JAGS_ROOT=/c/progra~1/JAGS/JAGS-4.3.2"
        Add-Content -Path $env:GITHUB_PATH -Value "$jagsRoot\x64\bin"
